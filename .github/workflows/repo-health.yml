name: Repo Health Check

on:
  pull_request:
    branches: [main]

jobs:
  health:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Run knip
        run: npx knip --reporter json > knip-output.json || true
      - name: Calculate Health Score
        run: node .github/scripts/health-score.js
      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          path: health-report.md
      - name: Read Health Score
        id: health
        run: echo "score=$(cat health-score.txt)" >> $GITHUB_OUTPUT
      - name: Invoke Codex (Low Health)
        if: steps.health.outputs.score < 80 && github.actor != 'codex[bot]'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `
            @codex

            Repository Health Score is below threshold.

            Create a refactor strategy.

            Requirements:
            - Analyze repository health report
            - Create docs/refactor/strategy.md
            - Open a Draft Pull Request
            - DO NOT modify runtime code
            `
            });
