name: Repo Health Check

on:
  pull_request:
    branches: [main]

jobs:
  health:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Run knip
        run: npx knip --reporter json > knip-output.json || true
      - name: Calculate Health Score
        run: node .github/scripts/health-score.js
      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          path: health-report.md
